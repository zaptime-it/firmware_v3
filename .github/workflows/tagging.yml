name: BTClock CI

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Build + run host tests (plain + ASan)
        run: |
          cmake -G Ninja -B build-tests       -S tests
          cmake -G Ninja -B build-tests-asan  -S tests -DBTCLOCK_TEST_SANITIZE=ON
          cmake --build build-tests      -j
          cmake --build build-tests-asan -j
          ctest --test-dir build-tests       --output-on-failure
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir build-tests-asan --output-on-failure

  build:
    runs-on: ubuntu-latest
    needs: host-tests
    strategy:
      fail-fast: false
      matrix:
        variant:
          - lolin_s3_mini_213epd
          - lolin_s3_mini_29epd
          - btclock_rev_b_213epd
          - btclock_v8_213epd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Install IDF + build helpers"
        uses: ./.github/actions/install-build
      - name: Build + stage ${{ matrix.variant }}
        shell: bash
        run: . $IDF_PATH/export.sh && ./scripts/build-release.sh ${{ matrix.variant }}
      - name: Upload variant artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.variant }}
          path: |
            release-stage/${{ matrix.variant }}/*.bin
            release-stage/${{ matrix.variant }}/*.sha256

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Install jq + coreutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq coreutils
      - name: Download all variant artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: build-*
          merge-multiple: false
          path: temp
      - name: Stage release assets + manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p release temp/manifest-fragments

          # Each artifact dir is build-<variant>/ with PIO-equivalent
          # asset names. We re-prefix per-variant artifacts to avoid
          # bootloader.bin / partitions.bin / etc. colliding across
          # variants while keeping the merged <variant>.bin and the
          # OTA-facing firmware.bin / littlefs_<size>.bin names stable.
          for d in temp/build-*; do
            [ -d "$d" ] || continue
            variant_id="${d#temp/build-}"

            # Merged single-flash image (release-direct).
            if [ -f "$d/${variant_id}.bin" ]; then
              cp "$d/${variant_id}.bin"        "release/${variant_id}.bin"
            fi

            # Raw OTA app image — the WebUI's OTA upload accepts this.
            if [ -f "$d/firmware.bin" ]; then
              cp "$d/firmware.bin"             "release/${variant_id}_firmware.bin"
            fi

            # Per-variant boot/partition/OTA-selector — prefixed so the
            # release dir holds one of each per variant.
            for support in bootloader.bin partitions.bin ota_data_initial.bin; do
              [ -f "$d/${support}" ] && \
                cp "$d/${support}"             "release/${variant_id}_${support}"
            done

            # LittleFS image keeps its flash-size-suffixed name so the
            # legacy updater can find it under littlefs_4MB.bin etc.
            littlefs_asset=""
            for fs in "$d"/littlefs_*.bin; do
              [ -f "$fs" ] || continue
              fs_name="$(basename "$fs")"
              littlefs_asset="$fs_name"
              [ -f "release/${fs_name}" ] || cp "$fs" "release/${fs_name}"
              break
            done

            chip="${variant_id%_*}"
            epd_variant="${variant_id##*_}"
            jq -n \
              --arg variant "$variant_id" \
              --arg chip "$chip" \
              --arg epd_variant "$epd_variant" \
              --arg firmware "${variant_id}_firmware.bin" \
              --arg merged "${variant_id}.bin" \
              --arg littlefs "$littlefs_asset" \
              --arg built_at "$(date -u +%FT%TZ)" \
              '{
                variant: $variant,
                chip: $chip,
                epd_variant: $epd_variant,
                firmware_asset: $firmware,
                merged_asset: $merged,
                littlefs_asset: $littlefs,
                bootloader_asset: ($variant + "_bootloader.bin"),
                partitions_asset: ($variant + "_partitions.bin"),
                ota_data_initial_asset: ($variant + "_ota_data_initial.bin"),
                built_at: $built_at
              }' > "temp/manifest-fragments/${variant_id}.json"
          done

          jq -n \
            --arg release_tag "$TAG" \
            --arg repository "$REPO" \
            --arg server_url "$SERVER" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --argjson variants "$(jq -s '.' temp/manifest-fragments/*.json)" \
            '{
              release_tag: $release_tag,
              repository: $repository,
              server_url: $server_url,
              generated_at: $generated_at,
              variants: $variants
            }' > release/manifest.json

          # Per-asset sha256 for release-side verification.
          (
            cd release
            for f in *.bin manifest.json; do
              [ -f "$f" ] || continue
              sha256sum "$f" > "$f.sha256"
            done
          )

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*.bin,release/*.sha256,release/manifest.json"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true

      - name: Push to web-flasher
        if: github.ref_type == 'tag'
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: release
          target-directory: firmware_v3/
          destination-github-username: "btclock"
          destination-repository-name: "web-flasher"
          target-branch: main
          user-name: ${{ github.actor }}
          user-email: ${{ github.actor }}@users.noreply.github.com
