name: BTClock CI

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: "Install and build"
        uses: ./.github/actions/install-build
      - name: Copy bootloader to output folder
        run: cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin .pio
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          retention-days: 1
          name: prepared-outputs
          path: .pio/**/*.bin
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    needs: build
    continue-on-error: true
    strategy:
      matrix:
        chip:
          - name: lolin_s3_mini
            version: esp32s3
          - name: btclock_rev_b
            version: esp32s3
          - name: btclock_v8
            version: esp32s3
        epd_variant: [213epd, 29epd]
        exclude:
          - chip: { name: btclock_rev_b, version: esp32s3 }
            epd_variant: 29epd
          - chip: { name: btclock_v8, version: esp32s3 }
            epd_variant: 29epd
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: prepared-outputs
          path: .pio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install esptools.py
        run: pip install --upgrade esptool
      - name: Create merged firmware binary
        shell: bash
        run: |
          mkdir -p ${{ matrix.chip.name }}_${{ matrix.epd_variant }} 
          if [ "${{ matrix.chip.name }}" == "btclock_v8" ]; then
            esptool.py --chip ${{ matrix.chip.version }} merge_bin \
            -o ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/${{ matrix.chip.name }}_${{ matrix.epd_variant }}.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/partitions.bin \
            0xe000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/ota_data_initial.bin \
            0x10000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/firmware.bin \
            0xDF0000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/littlefs_16MB.bin
          elif [ "${{ matrix.chip.name }}" == "btclock_rev_b" ]; then
            esptool.py --chip ${{ matrix.chip.version }} merge_bin \
            -o ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/${{ matrix.chip.name }}_${{ matrix.epd_variant }}.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 8MB \
            0x0000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/partitions.bin \
            0xe000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/ota_data_initial.bin \
            0x10000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/firmware.bin \
            0x6F0000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/littlefs_8MB.bin;
          else
            esptool.py --chip ${{ matrix.chip.version }} merge_bin \
            -o ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/${{ matrix.chip.name }}_${{ matrix.epd_variant }}.bin \
            --flash_mode dio \
            0x0000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/partitions.bin \
            0xe000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/ota_data_initial.bin \
            0x10000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/firmware.bin \
            0x380000 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/littlefs_4MB.bin
            # Adjust the offset for littlefs or other files as needed for the original case
          fi

      - name: Create checksum for firmware
        run: shasum -a 256 .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/firmware.bin | awk '{print $1}' > ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/${{ matrix.chip.name }}_${{ matrix.epd_variant }}_firmware.bin.sha256

      - name: Create checksum for merged binary
        run: shasum -a 256 ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/${{ matrix.chip.name }}_${{ matrix.epd_variant }}.bin | awk '{print $1}' > ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/${{ matrix.chip.name }}_${{ matrix.epd_variant }}.bin.sha256

      - name: Create checksum for littlefs partition
        shell: bash
        run: |
          fs_file=$(ls .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/littlefs*.bin | head -n1)
          fs_name=$(basename "$fs_file")
          shasum -a 256 "$fs_file" | awk '{print $1}' > "${{ matrix.chip.name }}_${{ matrix.epd_variant }}/${fs_name}.sha256"

      - name: Copy all artifacts to output folder
        run: cp .pio/build/${{ matrix.chip.name }}_${{ matrix.epd_variant }}/*.bin .pio/boot_app0.bin ${{ matrix.chip.name }}_${{ matrix.epd_variant }}

      - name: Create OTA binary file
        run: mv ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/firmware.bin ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/${{ matrix.chip.name }}_${{ matrix.epd_variant }}_firmware.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.chip.name }}-${{ matrix.epd_variant }}
          path: |
            ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/*.bin
            ${{ matrix.chip.name }}_${{ matrix.epd_variant }}/*.sha256
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    needs: merge
    steps:
      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq coreutils
      - name: Download matrix outputs
        uses: actions/download-artifact@v5
        with:
          pattern: build-*
          merge-multiple: false
          path: temp
      - name: Stage release assets (no collisions) + manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p release temp/manifest-fragments

          for d in temp/build-*; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            variant="${name#build-}"           # chip-epd_variant
            chip="${variant%-*}"               # chip can contain underscores
            epd_variant="${variant##*-}"
            variant_id="${chip}_${epd_variant}"

            firmware_asset="${variant_id}_firmware.bin"
            merged_asset="${variant_id}.bin"
            littlefs_asset=""

            if [ -f "$d/${firmware_asset}" ]; then
              cp "$d/${firmware_asset}" "release/${firmware_asset}"
            fi

            if [ -f "$d/${merged_asset}" ]; then
              cp "$d/${merged_asset}" "release/${merged_asset}"
            fi

            for support in bootloader.bin partitions.bin ota_data_initial.bin boot_app0.bin; do
              if [ -f "$d/${support}" ]; then
                cp "$d/${support}" "release/${variant_id}_${support}"
              fi
            done

            # Keep updater-facing LittleFS names stable (littlefs_4MB/8MB/16MB.bin).
            for fs in "$d"/littlefs*.bin; do
              [ -f "$fs" ] || continue
              fs_name="$(basename "$fs")"
              littlefs_asset="$fs_name"
              if [ ! -f "release/${fs_name}" ]; then
                cp "$fs" "release/${fs_name}"
              fi
              break
            done

            jq -n \
              --arg variant "$variant_id" \
              --arg chip "$chip" \
              --arg epd_variant "$epd_variant" \
              --arg firmware "$firmware_asset" \
              --arg merged "$merged_asset" \
              --arg littlefs "$littlefs_asset" \
              --arg built_at "$(date -u +%FT%TZ)" \
              '{
                variant: $variant,
                chip: $chip,
                epd_variant: $epd_variant,
                firmware_asset: $firmware,
                merged_asset: $merged,
                littlefs_asset: $littlefs,
                bootloader_asset: ($variant + "_bootloader.bin"),
                partitions_asset: ($variant + "_partitions.bin"),
                ota_data_initial_asset: ($variant + "_ota_data_initial.bin"),
                boot_app0_asset: ($variant + "_boot_app0.bin"),
                built_at: $built_at
              }' > "temp/manifest-fragments/${variant_id}.json"
          done

          jq -n \
            --arg release_tag "$TAG" \
            --arg repository "$REPO" \
            --arg server_url "$SERVER" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --argjson variants "$(jq -s '.' temp/manifest-fragments/*.json)" \
            '{
              release_tag: $release_tag,
              repository: $repository,
              server_url: $server_url,
              generated_at: $generated_at,
              variants: $variants
            }' > release/manifest.json

          (
            cd release
            for f in *.bin manifest.json; do
              [ -f "$f" ] || continue
              sha256sum "$f" > "$f.sha256"
            done
          )

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*.bin,release/*.sha256,release/manifest.json"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
        #   - name: Create release
        #   uses: ncipollo/release-action@v1
        #   with:
        #     artifacts: "output/full-firmware.bin,output/full-firmware.sha256,.pio/build/lolin_s3_mini_qr/*.bin"
        #     allowUpdates: true
        #     removeArtifacts: true
        #     makeLatest: true
      - name: Pushes full-firmware.bin to web flasher
        id: push_directory
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: .
          target-directory: firmware_v3/
          destination-github-username: "btclock"
          destination-repository-name: "web-flasher"
          target-branch: main
          user-name: ${{github.actor}}
          user-email: ${{github.actor}}@users.noreply.github.com
