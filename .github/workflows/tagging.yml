name: BTClock CI

# Mirrors .forgejo/workflows/push.yaml on the GitHub side. The Forgejo
# pipeline is the canonical CI per docs/TESTING.md; this file exists so
# anyone consuming the project from GitHub gets the same release flow.
#
# Pipeline graph:
#   tag/dispatch
#     ├── host-tests          (plain + sanitize unit tests, host gcc)
#     └── webui-and-lfs       (build WebUI once; pack 4MB/8MB/16MB LFS)
#           └── build matrix  (one row per variant, consumes prebuilt LFS)
#                 └── release (tag pushes only; collect, prefix, manifest)
#
# The espressif/idf:v5.5 container drops the IDF clone + install dance.
# WebUI + the three LFS images are built once and shared across the
# matrix — previously each variant re-ran pnpm install + pnpm build +
# gzip_build.py + littlefs-python create even though the WebUI output
# is identical across all four variants.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-host-tests-${{ github.sha }}
          restore-keys: |
            ccache-host-tests-
      - name: Build + run host tests (plain + ASan)
        run: |
          ccache -M 500M
          cmake -G Ninja -B .builds/tests       -S tests \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake -G Ninja -B .builds/tests-asan  -S tests -DBTCLOCK_TEST_SANITIZE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build .builds/tests      -j
          cmake --build .builds/tests-asan -j
          ctest --test-dir .builds/tests       --output-on-failure
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir .builds/tests-asan --output-on-failure
      - name: ccache stats
        if: always()
        run: ccache -s

  webui-and-lfs:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    needs: host-tests
    steps:
      - name: Install Node.js (for JS-based GitHub actions)
        shell: bash
        run: |
          apt-get update
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: data/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Build WebUI
        shell: bash
        working-directory: data
        run: |
          CI=true pnpm install --frozen-lockfile
          pnpm build
          python3 gzip_build.py
      - name: Install littlefs-python
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          pip install littlefs-python==0.15.0
      - name: Pack LFS images (4MB / 8MB / 16MB)
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          mkdir -p dist-lfs
          for size in 4MB 8MB 16MB; do
            ./scripts/pack-lfs-image.sh "$size" dist-lfs
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lfs-images
          path: dist-lfs/*.bin
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    needs: webui-and-lfs
    strategy:
      fail-fast: false
      matrix:
        variant:
          - lolin_s3_mini_213epd
          - lolin_s3_mini_29epd
          - btclock_rev_b_213epd
          - btclock_v8_213epd
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /root/.ccache
    steps:
      - name: Install Node.js (for JS-based GitHub actions)
        shell: bash
        run: |
          apt-get update
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs ccache
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            managed_components
            .builds/${{ matrix.variant }}
          key: idf-v5.5-${{ matrix.variant }}-${{ hashFiles('dependencies.lock', 'sdkconfig.defaults', format('sdkconfig.defaults.{0}', matrix.variant)) }}
          restore-keys: |
            idf-v5.5-${{ matrix.variant }}-
      - uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-idf-v5.5-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-idf-v5.5-${{ matrix.variant }}-
            ccache-idf-v5.5-
      - name: Install littlefs-python + esptool
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          pip install --upgrade littlefs-python==0.15.0 esptool
      - name: Download prebuilt LFS images
        uses: actions/download-artifact@v4
        with:
          name: lfs-images
          path: dist-lfs
      - name: Build + stage ${{ matrix.variant }}
        shell: bash
        env:
          BTCLOCK_USE_PREBUILT_LFS: ${{ github.workspace }}/dist-lfs
        run: |
          . /opt/esp/idf/export.sh
          ccache -M 2G
          ./scripts/build-release.sh ${{ matrix.variant }}
      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s
      - name: Upload variant artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.variant }}
          path: |
            release-stage/${{ matrix.variant }}/*.bin
            release-stage/${{ matrix.variant }}/*.sha256

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Install jq + coreutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq coreutils
      - name: Download all variant artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: false
          path: temp
      - name: Stage release assets + manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p release temp/manifest-fragments

          # Per-variant artifact dirs hold the assets emitted by
          # build-release.sh (firmware.bin, bootloader.bin, etc).
          # Re-prefix per-variant copies so the release dir holds
          # one of each per variant; keep merged <variant>.bin and
          # the OTA-facing firmware.bin / littlefs_<size>.bin names
          # stable.
          for d in temp/build-*; do
            [ -d "$d" ] || continue
            variant_id="${d#temp/build-}"

            if [ -f "$d/${variant_id}.bin" ]; then
              cp "$d/${variant_id}.bin"        "release/${variant_id}.bin"
            fi
            if [ -f "$d/firmware.bin" ]; then
              cp "$d/firmware.bin"             "release/${variant_id}_firmware.bin"
            fi
            for support in bootloader.bin partitions.bin ota_data_initial.bin; do
              [ -f "$d/${support}" ] && \
                cp "$d/${support}"             "release/${variant_id}_${support}"
            done

            littlefs_asset=""
            for fs in "$d"/littlefs_*.bin; do
              [ -f "$fs" ] || continue
              fs_name="$(basename "$fs")"
              littlefs_asset="$fs_name"
              [ -f "release/${fs_name}" ] || cp "$fs" "release/${fs_name}"
              break
            done

            chip="${variant_id%_*}"
            epd_variant="${variant_id##*_}"
            jq -n \
              --arg variant "$variant_id" \
              --arg chip "$chip" \
              --arg epd_variant "$epd_variant" \
              --arg firmware "${variant_id}_firmware.bin" \
              --arg merged "${variant_id}.bin" \
              --arg littlefs "$littlefs_asset" \
              --arg built_at "$(date -u +%FT%TZ)" \
              '{
                variant: $variant,
                chip: $chip,
                epd_variant: $epd_variant,
                firmware_asset: $firmware,
                merged_asset: $merged,
                littlefs_asset: $littlefs,
                bootloader_asset: ($variant + "_bootloader.bin"),
                partitions_asset: ($variant + "_partitions.bin"),
                ota_data_initial_asset: ($variant + "_ota_data_initial.bin"),
                built_at: $built_at
              }' > "temp/manifest-fragments/${variant_id}.json"
          done

          jq -n \
            --arg release_tag "$TAG" \
            --arg repository "$REPO" \
            --arg server_url "$SERVER" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --argjson variants "$(jq -s '.' temp/manifest-fragments/*.json)" \
            '{
              release_tag: $release_tag,
              repository: $repository,
              server_url: $server_url,
              generated_at: $generated_at,
              variants: $variants
            }' > release/manifest.json

          (
            cd release
            for f in *.bin manifest.json; do
              [ -f "$f" ] || continue
              sha256sum "$f" > "$f.sha256"
            done
          )

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*.bin,release/*.sha256,release/manifest.json"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true

      - name: Push to web-flasher
        if: github.ref_type == 'tag'
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: release
          target-directory: firmware_v3/
          destination-github-username: "btclock"
          destination-repository-name: "web-flasher"
          target-branch: main
          user-name: ${{ github.actor }}
          user-email: ${{ github.actor }}@users.noreply.github.com
