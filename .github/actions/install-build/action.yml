name: "Install IDF + build helpers"
description: >
  Composite action used by both pull_request.yml and tagging.yml. Sets
  up ESP-IDF v5.5, pnpm/node for the webui build, and the python tools
  needed by scripts/build-release.sh (littlefs-python, junit-xml for
  the host-test reporter).

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - uses: pnpm/action-setup@v4
      with:
        package_json_file: data/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: pnpm
        cache-dependency-path: "**/pnpm-lock.yaml"

    # ESP-IDF 5.5 with its tool cache. The install action drops idf.py
    # on PATH and exports IDF_PATH for downstream steps.
    - uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5
        target: esp32s3
        # We invoke idf.py manually in named steps; no project path to
        # auto-build here.
        path: .
        command: idf.py --version

    # Tooling the build-release.sh / host-test runner needs on top of
    # what IDF provides. Kept in a separate pip step so caching works.
    - shell: bash
      run: pip install --upgrade littlefs-python==0.15.0 esptool junitparser

    - shell: bash
      name: Build webui
      run: |
        cd data
        CI=true pnpm install --frozen-lockfile
        pnpm build
        python3 gzip_build.py
