dependencies:
  idf: ">=5.5"
  # Arduino-ESP32 as an IDF managed component — Espressif's official
  # registry entry. This is the key difference vs pioarduino: we get
  # the source, not 152 precompiled .a libs.
  espressif/arduino-esp32: "^3.3.0"
  # LittleFS for the WebUI assets partition.
  joltwallet/littlefs: "^1.16.4"
  # Used by getMyHostname() / mDNS broadcast.
  espressif/mdns: "^1.2.0"
  # Header-only; published as an official IDF component by the author.
  bblanchon/arduinojson: "^7.4.3"
  # Async webserver stack — same ESP32Async upstream as the previously
  # vendored arduino_libraries/AsyncTCP + ESPAsyncWebServer pair, just
  # published to the IDF Component Registry. ESPAsyncWebServer pulls in
  # asynctcp transitively, but we declare it explicitly so a fresh
  # dependency resolve still records the tighter constraint.
  esp32async/asynctcp: "^3.4.10"
  esp32async/espasyncwebserver: "^3.11.0"
