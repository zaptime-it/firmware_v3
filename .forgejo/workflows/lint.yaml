name: "Lint"

# Mirrors btclock_v4's lint gates:
# - clang-format check over the whole codebase
# - clang-tidy over the host-test compilation set
#
# We use the host-test CMake project (tests/CMakeLists.txt with
# CMAKE_EXPORT_COMPILE_COMMANDS=ON) to get a tractable include graph for
# tidy — firmware-only Arduino/IDF translation units aren't host-buildable.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  format:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    env:
      CLANG_VERSION: "22"
      CLANG_FORMAT: clang-format-22
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install clang-format-${{ env.CLANG_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            wget gnupg lsb-release software-properties-common ca-certificates git
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${CLANG_VERSION} main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            "clang-format-${CLANG_VERSION}"

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          # Format gate on all tracked C/C++ sources/headers in main/, lib/, tests/.
          files="$(git ls-files \
            'main/**/*.c' 'main/**/*.cpp' 'main/**/*.h' 'main/**/*.hpp' \
            'lib/**/*.c' 'lib/**/*.cpp' 'lib/**/*.h' 'lib/**/*.hpp' \
            'tests/**/*.c' 'tests/**/*.cpp' 'tests/**/*.h' 'tests/**/*.hpp' || true)"
          # Exclude generated font blobs (massive data arrays).
          files="$(echo "$files" | rg -v '^main/fonts/' || true)"
          if [ -z "$files" ]; then
            echo "No source files found for formatting gate."
            exit 0
          fi
          echo "$files" | xargs -n 50 "${CLANG_FORMAT}" --dry-run --Werror

  tidy:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    env:
      CLANG_VERSION: "22"
      CLANG_TIDY: clang-tidy-22
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools + clang-tidy-${{ env.CLANG_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            wget gnupg lsb-release software-properties-common ca-certificates git \
            build-essential cmake ninja-build jq ripgrep
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${CLANG_VERSION} main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            "clang-tidy-${CLANG_VERSION}" "clang-${CLANG_VERSION}"

      - name: Generate compile_commands.json (host-test CMake project)
        shell: bash
        run: |
          set -euo pipefail
          # CMAKE_EXPORT_COMPILE_COMMANDS=ON is baked into tests/CMakeLists.txt.
          # Configure-only is enough to produce the DB; no need to actually build.
          cmake -G Ninja -B .builds/tests -S tests
          # Symlink to repo root so `clang-tidy -p .` finds it.
          ln -sf .builds/tests/compile_commands.json compile_commands.json
          test -f compile_commands.json

      - name: Run clang-tidy (host-test compilation set)
        shell: bash
        run: |
          set -euo pipefail
          # Only run tidy on translation units that appear in the CMake-
          # generated compile_commands.json. This keeps the include graph
          # consistent with the host-test env and avoids pulling in
          # ESP32-only Arduino/IDF headers that aren't available to the
          # host toolchain.
          files="$(jq -r '.[].file' compile_commands.json | sort -u || true)"
          # The host-test scaffold only globs lib/btclock/*.cpp + tests/*/test_main.cpp,
          # so no firmware-only main/*.cpp ever lands in the DB. Belt-and-
          # braces: exclude anything under <repo>/main/.
          files="$(echo "$files" | rg -v '/main/' || true)"
          if [ -z "$files" ]; then
            echo "No .cpp files found for clang-tidy."
            exit 0
          fi
          echo "$files" | xargs -n 20 "${CLANG_TIDY}" -p .

