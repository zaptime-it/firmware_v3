name: "BTClock CI"

# Pipeline graph:
#
#   push/PR/tag/dispatch
#     ├── host-tests          (plain + sanitize unit tests, host gcc)
#     ├── set-matrix          (decide which firmware variants to build)
#     └── webui-and-lfs       (build WebUI once; pack 4MB/8MB/16MB LFS)
#           └── build matrix  (one row per variant, consumes prebuilt LFS)
#                 └── release (tags only; collect, prefix, manifest, ship)
#
# We use the espressif/idf:v5.5 container so the firmware jobs don't burn
# ~8 minutes per matrix row cloning and installing ESP-IDF from scratch.
# Same trick btclock_v4 uses with espressif/idf:v6.0.1. WebUI + the three
# LFS images are built once and shared across the matrix — previously
# each variant re-ran pnpm install + pnpm build + gzip_build.py +
# littlefs-python create even though the WebUI output is identical
# across all four variants.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  host-tests:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    env:
      CCACHE_DIR: /root/.ccache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build g++ ccache
      - uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-host-tests-${{ github.sha }}
          restore-keys: |
            ccache-host-tests-
      - name: Build host tests (plain + ASan)
        shell: bash
        run: |
          ccache -M 500M
          cmake -G Ninja -B .builds/tests       -S tests \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake -G Ninja -B .builds/tests-asan  -S tests -DBTCLOCK_TEST_SANITIZE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build .builds/tests      -j
          cmake --build .builds/tests-asan -j
      - name: Run plain tests
        shell: bash
        run: ctest --test-dir .builds/tests --output-on-failure --output-junit junit-plain.xml
      - name: Run sanitize tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir .builds/tests-asan --output-on-failure --output-junit junit-asan.xml
      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s

  set-matrix:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR latency budget: build only the two boards we ship most
            # bugfixes against. Other variants run on tags/dispatch.
            echo 'matrix={"variant":["lolin_s3_mini_213epd","btclock_rev_b_213epd"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"variant":["lolin_s3_mini_213epd","lolin_s3_mini_29epd","btclock_rev_b_213epd","btclock_v8_213epd"]}' >> "$GITHUB_OUTPUT"
          fi

  webui-and-lfs:
    # Build the WebUI once, pack one LittleFS image per supported flash
    # size, and publish them as an artifact for the firmware matrix.
    # Output filenames (littlefs_4MB.bin / littlefs_8MB.bin /
    # littlefs_16MB.bin) match what scripts/build-release.sh emits, so
    # downstream consumers (release dedupe, manifest) don't care whether
    # the image was packed in CI or locally.
    runs-on: docker
    container:
      image: espressif/idf:v5.5
    needs: host-tests
    steps:
      - name: Install Node.js (for JS-based Forgejo actions)
        shell: bash
        run: |
          apt-get update
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: data/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Build WebUI
        shell: bash
        working-directory: data
        run: |
          CI=true pnpm install --frozen-lockfile
          pnpm build
          python3 gzip_build.py
      - name: Install littlefs-python
        shell: bash
        # The espressif/idf image's pip lives inside its managed venv —
        # sourcing export.sh puts it on PATH.
        run: |
          . /opt/esp/idf/export.sh
          pip install littlefs-python==0.17.1
      - name: Pack LFS images (4MB / 8MB / 16MB)
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          mkdir -p dist-lfs
          for size in 4MB 8MB 16MB; do
            ./scripts/pack-lfs-image.sh "$size" dist-lfs
          done
          ls -la dist-lfs
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: lfs-images
          path: dist-lfs/*.bin
          retention-days: 14

  build:
    runs-on: docker
    container:
      image: espressif/idf:v5.5
    needs: [webui-and-lfs, set-matrix]
    permissions:
      contents: write
      checks: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    env:
      # ccache shaves cache-miss rebuilds (sdkconfig touched but source
      # unchanged) from ~10 min/variant to a link + a few recompiles.
      # ESP-IDF picks it up via IDF_CCACHE_ENABLE below.
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /root/.ccache
    steps:
      - name: Install Node.js (for JS-based Forgejo actions)
        shell: bash
        run: |
          apt-get update
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs ccache
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # Cache IDF managed_components + per-variant build dir. Key reflects
      # the inputs that actually change the build: dependency versions
      # and the chained sdkconfig fragments.
      - uses: actions/cache@v5
        with:
          path: |
            managed_components
            .builds/${{ matrix.variant }}
          key: idf-v5.5-${{ matrix.variant }}-${{ hashFiles('dependencies.lock', 'sdkconfig.defaults', format('sdkconfig.defaults.{0}', matrix.variant)) }}
          restore-keys: |
            idf-v5.5-${{ matrix.variant }}-
      # Independent ccache cache: SHA-keyed write means each commit gets
      # a fresh save, prefix-keyed restore falls back to the most recent
      # variant cache.
      - uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-idf-v5.5-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-idf-v5.5-${{ matrix.variant }}-
            ccache-idf-v5.5-
      - name: Install littlefs-python + esptool
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          pip install --upgrade littlefs-python==0.17.1 esptool
      - name: Download prebuilt LFS images
        uses: https://code.forgejo.org/forgejo/download-artifact@v7
        with:
          name: lfs-images
          path: dist-lfs
      - name: Build + stage ${{ matrix.variant }}
        shell: bash
        env:
          BTCLOCK_USE_PREBUILT_LFS: ${{ github.workspace }}/dist-lfs
        run: |
          . /opt/esp/idf/export.sh
          ccache -M 2G
          ./scripts/build-release.sh ${{ matrix.variant }}
      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s
      - name: Upload variant artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-${{ matrix.variant }}
          path: |
            release-stage/${{ matrix.variant }}/*.bin
            release-stage/${{ matrix.variant }}/*.sha256

  release:
    runs-on: docker
    if: github.event_name != 'pull_request'
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    permissions:
      contents: write
      checks: write
    needs: build
    steps:
      - name: Install tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq coreutils
      - name: Download matrix outputs
        uses: https://code.forgejo.org/forgejo/download-artifact@v7
        with:
          pattern: build-*
          merge-multiple: false
          path: temp
      - name: Stage release assets + manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p release temp/manifest-fragments

          for d in temp/build-*; do
            [ -d "$d" ] || continue
            variant_id="${d#temp/build-}"

            if [ -f "$d/${variant_id}.bin" ]; then
              cp "$d/${variant_id}.bin"        "release/${variant_id}.bin"
            fi
            if [ -f "$d/firmware.bin" ]; then
              cp "$d/firmware.bin"             "release/${variant_id}_firmware.bin"
            fi
            for support in bootloader.bin partitions.bin ota_data_initial.bin; do
              [ -f "$d/${support}" ] && \
                cp "$d/${support}"             "release/${variant_id}_${support}"
            done

            littlefs_asset=""
            for fs in "$d"/littlefs_*.bin; do
              [ -f "$fs" ] || continue
              fs_name="$(basename "$fs")"
              littlefs_asset="$fs_name"
              [ -f "release/${fs_name}" ] || cp "$fs" "release/${fs_name}"
              break
            done

            chip="${variant_id%_*}"
            epd_variant="${variant_id##*_}"
            jq -n \
              --arg variant "$variant_id" \
              --arg chip "$chip" \
              --arg epd_variant "$epd_variant" \
              --arg firmware "${variant_id}_firmware.bin" \
              --arg merged "${variant_id}.bin" \
              --arg littlefs "$littlefs_asset" \
              --arg built_at "$(date -u +%FT%TZ)" \
              '{
                variant: $variant,
                chip: $chip,
                epd_variant: $epd_variant,
                firmware_asset: $firmware,
                merged_asset: $merged,
                littlefs_asset: $littlefs,
                bootloader_asset: ($variant + "_bootloader.bin"),
                partitions_asset: ($variant + "_partitions.bin"),
                ota_data_initial_asset: ($variant + "_ota_data_initial.bin"),
                built_at: $built_at
              }' > "temp/manifest-fragments/${variant_id}.json"
          done

          jq -n \
            --arg release_tag "$TAG" \
            --arg repository "$REPO" \
            --arg server_url "$SERVER" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --argjson variants "$(jq -s '.' temp/manifest-fragments/*.json)" \
            '{
              release_tag: $release_tag,
              repository: $repository,
              server_url: $server_url,
              generated_at: $generated_at,
              variants: $variants
            }' > release/manifest.json

          (
            cd release
            for f in *.bin manifest.json; do
              [ -f "$f" ] || continue
              sha256sum "$f" > "$f.sha256"
            done
          )

      - name: Create release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.12.0
        with:
          url: "https://git.btclock.dev"
          repo: "${{ github.repository }}"
          direction: upload
          tag: "${{ github.ref_name }}"
          sha: "${{ github.sha }}"
          release-dir: release
          token: ${{ secrets.TOKEN }}
          override: ${{ github.ref_type != 'tag' && github.ref_name != 'main' }}
          prerelease: ${{ github.ref_type != 'tag' && github.ref_name != 'main' }}
          release-notes-assistant: false
