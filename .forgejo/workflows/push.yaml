name: "BTClock CI"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  host-tests:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Build host tests (plain + ASan)
        shell: bash
        run: |
          cmake -G Ninja -B build-tests       -S tests
          cmake -G Ninja -B build-tests-asan  -S tests -DBTCLOCK_TEST_SANITIZE=ON
          cmake --build build-tests      -j
          cmake --build build-tests-asan -j
      - name: Run plain tests
        shell: bash
        run: ctest --test-dir build-tests --output-on-failure --output-junit junit-plain.xml
      - name: Run sanitize tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-tests-asan --output-on-failure --output-junit junit-asan.xml

  set-matrix:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR latency budget: build only the two boards we ship most
            # bugfixes against. Other variants run on tags/dispatch.
            echo 'matrix={"variant":["lolin_s3_mini_213epd","btclock_rev_b_213epd"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"variant":["lolin_s3_mini_213epd","lolin_s3_mini_29epd","btclock_rev_b_213epd","btclock_v8_213epd"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    needs: [host-tests, set-matrix]
    permissions:
      contents: write
      checks: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: data/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install ESP-IDF v5.5
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git wget flex bison gperf cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0
          mkdir -p ~/esp
          git clone --depth 1 --branch v5.5 --recurse-submodules \
            --shallow-submodules https://github.com/espressif/esp-idf.git ~/esp/esp-idf
          ~/esp/esp-idf/install.sh esp32s3
      - name: Install littlefs-python + esptool
        shell: bash
        run: pip install --upgrade littlefs-python==0.15.0 esptool
      - name: Build webui
        shell: bash
        run: |
          cd data
          CI=true pnpm install --frozen-lockfile
          pnpm build
          python3 gzip_build.py
      - name: Build + stage ${{ matrix.variant }}
        shell: bash
        run: . ~/esp/esp-idf/export.sh && ./scripts/build-release.sh ${{ matrix.variant }}
      - name: Upload variant artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: build-${{ matrix.variant }}
          path: |
            release-stage/${{ matrix.variant }}/*.bin
            release-stage/${{ matrix.variant }}/*.sha256

  release:
    runs-on: docker
    if: github.event_name != 'pull_request'
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    permissions:
      contents: write
      checks: write
    needs: build
    steps:
      - name: Install tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq coreutils
      - name: Download matrix outputs
        uses: https://code.forgejo.org/forgejo/download-artifact@v7
        with:
          pattern: build-*
          merge-multiple: false
          path: temp
      - name: Stage release assets + manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p release temp/manifest-fragments

          for d in temp/build-*; do
            [ -d "$d" ] || continue
            variant_id="${d#temp/build-}"

            if [ -f "$d/${variant_id}.bin" ]; then
              cp "$d/${variant_id}.bin"        "release/${variant_id}.bin"
            fi
            if [ -f "$d/firmware.bin" ]; then
              cp "$d/firmware.bin"             "release/${variant_id}_firmware.bin"
            fi
            for support in bootloader.bin partitions.bin ota_data_initial.bin; do
              [ -f "$d/${support}" ] && \
                cp "$d/${support}"             "release/${variant_id}_${support}"
            done

            littlefs_asset=""
            for fs in "$d"/littlefs_*.bin; do
              [ -f "$fs" ] || continue
              fs_name="$(basename "$fs")"
              littlefs_asset="$fs_name"
              [ -f "release/${fs_name}" ] || cp "$fs" "release/${fs_name}"
              break
            done

            chip="${variant_id%_*}"
            epd_variant="${variant_id##*_}"
            jq -n \
              --arg variant "$variant_id" \
              --arg chip "$chip" \
              --arg epd_variant "$epd_variant" \
              --arg firmware "${variant_id}_firmware.bin" \
              --arg merged "${variant_id}.bin" \
              --arg littlefs "$littlefs_asset" \
              --arg built_at "$(date -u +%FT%TZ)" \
              '{
                variant: $variant,
                chip: $chip,
                epd_variant: $epd_variant,
                firmware_asset: $firmware,
                merged_asset: $merged,
                littlefs_asset: $littlefs,
                bootloader_asset: ($variant + "_bootloader.bin"),
                partitions_asset: ($variant + "_partitions.bin"),
                ota_data_initial_asset: ($variant + "_ota_data_initial.bin"),
                built_at: $built_at
              }' > "temp/manifest-fragments/${variant_id}.json"
          done

          jq -n \
            --arg release_tag "$TAG" \
            --arg repository "$REPO" \
            --arg server_url "$SERVER" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --argjson variants "$(jq -s '.' temp/manifest-fragments/*.json)" \
            '{
              release_tag: $release_tag,
              repository: $repository,
              server_url: $server_url,
              generated_at: $generated_at,
              variants: $variants
            }' > release/manifest.json

          (
            cd release
            for f in *.bin manifest.json; do
              [ -f "$f" ] || continue
              sha256sum "$f" > "$f.sha256"
            done
          )

      - name: Create release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.12.0
        with:
          url: "https://git.btclock.dev"
          repo: "${{ github.repository }}"
          direction: upload
          tag: "${{ github.ref_name }}"
          sha: "${{ github.sha }}"
          release-dir: release
          token: ${{ secrets.TOKEN }}
          override: ${{ github.ref_type != 'tag' && github.ref_name != 'main' }}
          prerelease: ${{ github.ref_type != 'tag' && github.ref_name != 'main' }}
          release-notes-assistant: false
